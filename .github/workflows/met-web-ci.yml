name: MET WEB CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "met-web/**"
  push:
    branches:
      - main    

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./met-web

jobs:
  setup-job:
    runs-on: ubuntu-22.04

    if: github.repository == 'bcgov/epic-engage'

    steps:
      - uses: actions/checkout@v6
      - run: "true"

  met-web-linting:
    needs: setup-job
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm ci
      - name: Lint
        id: lint
        run: |
          npm run lint

  met-web-testing:
    needs: setup-job
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Test with jest
        id: test
        run: |
          npm test -- --coverage

      # Set codecov branch name with prefix if pull request
      - name: Sets Codecov branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "CODECOV_BRANCH=PR_${HEAD_REF}" >> "$GITHUB_ENV"
        if: github.event_name == 'pull_request'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          flags: metweb
          name: codecov-met-web
          fail_ci_if_error: false    
          verbose: true
          override_branch: ${{env.CODECOV_BRANCH}}
          token: ${{ secrets.CODECOV_TOKEN }}

  build-check:
    needs: setup-job
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm ci
      - name: build to check strictness
        id: build
        run: |
          npm run build
